[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chartbreak"
version = "0.1.0"
description = "Reproducible chart-generation experiments for Team 11"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "pandas>=2,<3", "matplotlib>=3.8,<4", "scikit-learn>=1.4,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
chartbreak = "chartbreak.cli:main"

[tool.setuptools.packages.find]
include = ["chartbreak*"]
